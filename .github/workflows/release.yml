name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_api:
        description: 'Deploy API'
        required: false
        type: boolean
        default: true
      release_cli:
        description: 'Publish CLI to npm'
        required: false
        type: boolean
        default: true
      release_landing:
        description: 'Deploy landing page'
        required: false
        type: boolean
        default: true

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  release-api:
    name: Deploy API to Fly.io
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.release_api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        working-directory: ./api
        run: flyctl deploy --remote-only --ha=false

  release-cli:
    name: Publish CLI to npm
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.release_cli
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Get version from tag
        if: github.event_name == 'push'
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update version
        if: github.event_name == 'push'
        working-directory: ./packages/create-devloop
        run: npm version ${{ env.VERSION }} --no-git-tag-version

      - name: Publish to npm
        working-directory: ./packages/create-devloop
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-landing:
    name: Deploy Landing Page
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.release_landing
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./landing
        run: npm ci

      - name: Build
        working-directory: ./landing
        run: npm run build
        env:
          VITE_API_URL: https://api.devloop.dev

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./landing

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-api, release-cli, release-landing]
    if: github.event_name == 'push' && always()
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: v${{ env.VERSION }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
