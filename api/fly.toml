# fly.toml - DevLoop API

app = "devloop-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_NAME = "DevLoop"
  ENVIRONMENT = "production"
  DEBUG = "false"
  CORS_ORIGINS = "https://devloop-landing.fly.dev,https://devloop.dev,http://localhost:3000,http://localhost:5173"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    port = 8000
    timeout = "10s"
    type = "http"
